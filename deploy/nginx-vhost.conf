# de.seafile.com im nativen nginx auf 159.69.197.36.
#
# Gegenueber der WordPress-Fassung faellt alles weg, was mit PHP zu tun
# hatte: der Front-Controller (`rewrite ^.*$ /index.php`), der
# fastcgi_pass auf php8.4-fpm und der Block fuer wp-login.php. Dafuer
# steht hier nur noch eine Weiterreichung an den Container auf 8083.
#
# Die Ausliefer-Regeln stecken im Image (deploy/Caddyfile.container),
# nicht hier.
#
# Die vhosts fuer seafile.de und www.seafile.de bleiben unberuehrt; den
# Block fuer Port 80 ebenfalls nicht anfassen - dort haengt die
# acme-challenge, ueber die das Zertifikat erneuert wird.

# Expires map
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/javascript     max;
    ~image/                    max;
}

server {
  listen 443 ssl;
  http2 on;
  server_name de.seafile.com;
  ssl_certificate /etc/letsencrypt/live/de.seafile.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/de.seafile.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_dhparam /etc/nginx/dhparam.pem;
  ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
  ssl_ecdh_curve secp384r1;
  ssl_session_timeout  10m;
  ssl_session_cache shared:SSL:10m;

  # always ist hier noetig: ohne das Schluesselwort fallen diese Header
  # weg, sobald eine location eigene add_header setzt - und sie fehlen
  # dann auch bei 301 und 410, also bei einem guten Teil der Antworten.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Grosszuegig: der Container liefert nur Dateien aus, einzig
  # /api/trial reicht einen POST weiter.
  client_max_body_size 1m;

  location / {
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 10240;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/css text/javascript text/xml text/plain text/x-component application/javascript application/json application/xml application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
  gzip_disable "MSIE [1-6]\.";
  expires $expires;
}
